<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
    <defs>
        <radialGradient id="glow" cx="26%" cy="88%" r="80%">
            <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.7"/>
            <stop offset="55%" stop-color="#312e81" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glow2" cx="82%" cy="8%" r="55%">
            <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a5b4fc"/>
            <stop offset="55%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#4338ca"/>
        </linearGradient>
        <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#818cf8" stop-opacity="0"/>
            <stop offset="0.25" stop-color="#a5b4fc" stop-opacity="0.9"/>
            <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
            <stop offset="0.75" stop-color="#a5b4fc" stop-opacity="0.9"/>
            <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
        </linearGradient>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="18"/>
        </filter>
    </defs>

    <rect width="1024" height="1024" fill="#0f172a"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="url(#glow2)"/>

    <!-- subtle inner border for depth -->
    <rect x="6" y="6" width="1012" height="1012" rx="0" fill="none" stroke="#1e293b" stroke-width="12" opacity="0.6"/>

    <!-- viewfinder corner brackets -->
    <g stroke="url(#frame)" stroke-width="34" fill="none" stroke-linecap="round">
        <path d="M 348 300 L 258 300 Q 214 300 214 344 L 214 430"/>
        <path d="M 676 300 L 766 300 Q 810 300 810 344 L 810 430"/>
        <path d="M 214 594 L 214 680 Q 214 724 258 724 L 348 724"/>
        <path d="M 810 594 L 810 680 Q 810 724 766 724 L 676 724"/>
    </g>

    <!-- barcode bars -->
    <g fill="#e2e8f0">
        <rect x="306" y="424" width="26" height="176" rx="6"/>
        <rect x="348" y="424" width="14" height="176" rx="5"/>
        <rect x="378" y="424" width="34" height="176" rx="6"/>
        <rect x="428" y="424" width="16" height="176" rx="5"/>
        <rect x="458" y="424" width="40" height="176" rx="6"/>
        <rect x="514" y="424" width="16" height="176" rx="5"/>
        <rect x="546" y="424" width="28" height="176" rx="6"/>
        <rect x="590" y="424" width="14" height="176" rx="5"/>
        <rect x="620" y="424" width="34" height="176" rx="6"/>
        <rect x="670" y="424" width="18" height="176" rx="5"/>
        <rect x="704" y="424" width="26" height="176" rx="6"/>
    </g>

    <!-- glowing scan line -->
    <rect x="240" y="455" width="544" height="106" rx="53" fill="url(#line)" opacity="0.16" filter="url(#soft)"/>
    <rect x="248" y="503" width="528" height="10" rx="5" fill="url(#line)"/>

    <!-- faint bottom reflection -->
    <rect x="214" y="770" width="596" height="10" rx="5" fill="#6366f1" opacity="0.28"/>
</svg>
